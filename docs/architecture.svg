<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="680" fill="#ffffff"/>

  <!-- Top Title Bar -->
  <rect x="40" y="24" width="1120" height="64" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <circle cx="72" cy="56" r="14" fill="#fc6d26" opacity="0.12"/>
  <path d="M 66 56 L 70 60 L 78 52" fill="none" stroke="#fc6d26" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="96" y="62" fill="#0f172a" font-size="20" font-weight="700" letter-spacing="-0.3">Enterprise Multi-Stage GitLab CI/CD Cloud Pipeline Architecture</text>
  
  <rect x="880" y="42" width="125" height="28" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="1"/>
  <text x="898" y="60" fill="#15803d" font-size="11" font-weight="700">DIND BUILDX</text>
  <rect x="1015" y="42" width="125" height="28" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <text x="1025" y="60" fill="#1d4ed8" font-size="11" font-weight="700">MANUAL GATE</text>

  <!-- COLUMN 1: Validate & Test with Caching -->
  <rect x="40" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 40 122 A 10 10 0 0 1 50 112 L 280 112 A 10 10 0 0 1 290 122 L 290 156 L 40 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="56" y="141" fill="#0f172a" font-size="13" font-weight="700">1. VALIDATE &amp; TEST</text>

  <rect x="56" y="174" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="200" fill="#0f172a" font-size="13" font-weight="700">Multi-Tier Caching</text>
  <text x="70" y="222" fill="#64748b" font-size="11">Key: $CI_COMMIT_REF_SLUG</text>
  <rect x="70" y="236" width="120" height="20" rx="4" fill="#e0f2fe"/>
  <text x="78" y="250" fill="#0369a1" font-size="10" font-weight="600">.npm/ &amp; .pip-cache/</text>

  <rect x="56" y="286" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="312" fill="#0f172a" font-size="13" font-weight="700">Code Quality Linting</text>
  <text x="70" y="334" fill="#64748b" font-size="11">ESLint, Prettier, Yamllint</text>
  <rect x="70" y="348" width="130" height="20" rx="4" fill="#f0fdf4"/>
  <text x="78" y="362" fill="#15803d" font-size="10" font-weight="600">Stage: validate</text>

  <rect x="56" y="398" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="424" fill="#0f172a" font-size="13" font-weight="700">Unit &amp; Integration Tests</text>
  <text x="70" y="446" fill="#64748b" font-size="11">Node.js, Pytest, Go Test</text>
  <rect x="70" y="460" width="130" height="20" rx="4" fill="#fef3c7"/>
  <text x="78" y="474" fill="#b45309" font-size="10" font-weight="600">Cobertura XML Reports</text>

  <rect x="56" y="510" width="218" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="536" fill="#0f172a" font-size="13" font-weight="700">Auto-Retry Resilience</text>
  <text x="70" y="558" fill="#64748b" font-size="11">retry: runner_system_failure</text>
  <text x="70" y="578" fill="#0284c7" font-size="10" font-weight="600">Self-Healing Pipeline</text>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="290" y1="372" x2="330" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 2: Security & Vulnerability Audits -->
  <rect x="330" y="112" width="260" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 330 122 A 10 10 0 0 1 340 112 L 580 112 A 10 10 0 0 1 590 122 L 590 156 L 330 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="348" y="141" fill="#0f172a" font-size="13" font-weight="700">2. SECURITY GATES</text>

  <rect x="348" y="174" width="224" height="135" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
  <text x="362" y="200" fill="#0369a1" font-size="14" font-weight="700">Gitleaks Secret Audit</text>
  <text x="362" y="222" fill="#0f172a" font-size="11">Deep commit history scan</text>
  <text x="362" y="240" fill="#64748b" font-size="11">• AWS, GCP, Azure Tokens</text>
  <text x="362" y="258" fill="#64748b" font-size="11">• SSH &amp; Cryptographic keys</text>
  <rect x="362" y="284" width="135" height="16" rx="3" fill="#dc2626"/>
  <text x="368" y="295" fill="#ffffff" font-size="9" font-weight="700">ZERO SECRETS LEAKED</text>

  <rect x="348" y="325" width="224" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="351" fill="#0f172a" font-size="13" font-weight="700">Semgrep SAST Scanning</text>
  <text x="362" y="373" fill="#64748b" font-size="11">Abstract Syntax Tree Analysis</text>
  <text x="362" y="393" fill="#475569" font-size="11">• OWASP Top 10 vulnerabilities</text>
  <text x="362" y="411" fill="#475569" font-size="11">• SQL Injection &amp; Command Exec</text>
  <rect x="362" y="426" width="140" height="20" rx="4" fill="#dcfce7"/>
  <text x="370" y="440" fill="#15803d" font-size="10" font-weight="600">Deterministic SAST</text>

  <rect x="348" y="476" width="224" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="362" y="502" fill="#0f172a" font-size="13" font-weight="700">Trivy Filesystem CVE Scan</text>
  <text x="362" y="524" fill="#64748b" font-size="11">OS package &amp; lockfile check</text>
  <text x="362" y="544" fill="#475569" font-size="11">• CRITICAL &amp; HIGH thresholds</text>
  <text x="362" y="564" fill="#475569" font-size="11">• SBOM inventory generation</text>
  <text x="362" y="586" fill="#0284c7" font-size="10" font-weight="600">Dependency Guardrail</text>

  <!-- Flow Arrow 2 to 3 -->
  <line x1="590" y1="372" x2="630" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 3: DinD Docker Buildx -->
  <rect x="630" y="112" width="250" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 630 122 A 10 10 0 0 1 640 112 L 870 112 A 10 10 0 0 1 880 122 L 880 156 L 630 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="646" y="141" fill="#0f172a" font-size="13" font-weight="700">3. DIND BUILDX ENGINE</text>

  <rect x="646" y="174" width="218" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="200" fill="#0f172a" font-size="13" font-weight="700">Docker:24.0-dind Daemon</text>
  <text x="660" y="222" fill="#64748b" font-size="11">Secure mTLS daemon transport</text>
  <text x="660" y="240" fill="#475569" font-size="11">• DOCKER_TLS_CERTDIR=/certs</text>
  <text x="660" y="258" fill="#475569" font-size="11">• DOCKER_DRIVER=overlay2</text>
  <text x="660" y="276" fill="#475569" font-size="11">• TCP socket on port 2376</text>
  <rect x="660" y="284" width="135" height="16" rx="3" fill="#0284c7"/>
  <text x="666" y="295" fill="#ffffff" font-size="9" font-weight="700">OPTIMIZED RUNTIME</text>

  <rect x="646" y="325" width="218" height="135" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="351" fill="#0f172a" font-size="13" font-weight="700">Layer Cache Reuse</text>
  <text x="660" y="373" fill="#64748b" font-size="11">--cache-from $IMAGE_LATEST</text>
  <text x="660" y="391" fill="#475569" font-size="11">• Slashes container build times</text>
  <text x="660" y="409" fill="#475569" font-size="11">• Multi-stage Dockerfile targets</text>
  <rect x="660" y="426" width="140" height="20" rx="4" fill="#dcfce7"/>
  <text x="670" y="440" fill="#15803d" font-size="10" font-weight="600">Sub-minute Build Time</text>

  <rect x="646" y="476" width="218" height="130" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="660" y="502" fill="#0f172a" font-size="13" font-weight="700">GitLab Registry Push</text>
  <text x="660" y="524" fill="#64748b" font-size="11">Dual tagging strategy:</text>
  <text x="660" y="544" fill="#475569" font-size="11">• $CI_REGISTRY_IMAGE:$SHA</text>
  <text x="660" y="564" fill="#475569" font-size="11">• $CI_REGISTRY_IMAGE:latest</text>
  <text x="660" y="586" fill="#0284c7" font-size="10" font-weight="600">Immutable Digests</text>

  <!-- Flow Arrow 3 to 4 -->
  <line x1="880" y1="372" x2="920" y2="372" stroke="#0284c7" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- COLUMN 4: Staging & Production Deployments -->
  <rect x="920" y="112" width="240" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#softShadow)"/>
  <path d="M 920 122 A 10 10 0 0 1 930 112 L 1150 112 A 10 10 0 0 1 1160 122 L 1160 156 L 920 156 Z" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="936" y="141" fill="#0f172a" font-size="13" font-weight="700">4. K8S DEPLOYMENTS</text>

  <rect x="936" y="174" width="208" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="200" fill="#0f172a" font-size="13" font-weight="700">Automated Staging</text>
  <text x="950" y="222" fill="#64748b" font-size="11">Continuous deployment</text>
  <text x="950" y="242" fill="#475569" font-size="11">kubectl apply -f k8s/staging/</text>
  <text x="950" y="258" fill="#475569" font-size="11">Automated smoke test probe</text>
  <text x="950" y="272" fill="#15803d" font-size="10" font-weight="600">Environment: staging</text>

  <rect x="936" y="300" width="208" height="100" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="950" y="326" fill="#991b1b" font-size="13" font-weight="700">Production Manual Gate</text>
  <text x="950" y="348" fill="#b91c1c" font-size="11">when: manual policy</text>
  <text x="950" y="368" fill="#b91c1c" font-size="11" font-weight="600">Requires Senior Approval</text>
  <text x="950" y="384" fill="#475569" font-size="10">Guards live production cluster</text>

  <rect x="936" y="416" width="208" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="442" fill="#0f172a" font-size="13" font-weight="700">Zero-Downtime Rollout</text>
  <text x="950" y="464" fill="#64748b" font-size="11">Kubernetes RollingUpdate</text>
  <text x="950" y="484" fill="#475569" font-size="11">maxSurge: 1, maxUnavailable: 0</text>
  <text x="950" y="498" fill="#0284c7" font-size="10" font-weight="600">High Availability 99.99%</text>

  <rect x="936" y="528" width="208" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="950" y="554" fill="#0f172a" font-size="13" font-weight="700">One-Click Rollback</text>
  <text x="950" y="576" fill="#dc2626" font-size="11" font-weight="600">kubectl rollout undo</text>
  <text x="950" y="592" fill="#64748b" font-size="10">Sub-minute incident recovery</text>
</svg>
